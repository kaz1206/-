[project]
name = "robustlab"
version = "0.1.0"
description = "MT5 EA robustness research lab (P1: safe single backtest execution and reproducible storage)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.13",
    "PyYAML>=6.0.3",
    "typer>=0.27",
    "psutil>=7.2",
    "pyarrow>=25.0",
]

[project.scripts]
rlab = "robustlab.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "hypothesis>=6.168",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robustlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
