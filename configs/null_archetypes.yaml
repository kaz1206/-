# P10 null-hypothesis test (P10_PLAN §1-§3, approved 2026-10-12). Hashed into every execution.
# The judgement run is fixed in advance: 1,000 rounds per archetype, seed 20261013, once (P10_PLAN §1.3).
version: null1
account: {deposit: 10000.0, leverage: 100.0, contract: 100000.0, pip: 0.0001, spread: 0.0001, stop_out_pct: 50.0,
          start_price: 1.10}
price: {sigma_bar: 0.0022, garch_alpha: 0.05, garch_beta: 0.93, t_df: 5, bars_per_day: 6, steps_per_bar: 8}
days: {D: 520, V0: 520, V1: 130, F: 260}
chunk: 50
criterion: {max_upper_bound: 0.05, confidence: 0.95, s1_max_se: 3.0}
modes:
  judgement: {rounds: 1000, seed: 20261013, kind: "null"}
  reproduction: {rounds: 400, seed: 20261012, kind: "null"}
  power: {rounds: 200, seed: 20261012, kind: edge}
archetypes:
  A1: {type: trend, profile: swing_trend, axes: [fast, slow], a: [5, 10, 15, 20, 25], b: [40, 60, 80, 100, 120],
       lot: 0.10, edge_ar: 0.05}
  A2: {type: grid, profile: mean_reversion, axes: [grid, tp], a: [10, 15, 20, 30, 40], b: [5, 10, 15, 20, 30],
       base: 0.05, max_levels: 10, edge_ar: -0.05}
  A3: {type: martingale, profile: mean_reversion, axes: [mult, grid], a: [1.2, 1.4, 1.6, 1.8, 2.0],
       b: [10, 15, 20, 30, 40], base: 0.01, max_levels: 12, tp: 10, edge_ar: -0.05}
