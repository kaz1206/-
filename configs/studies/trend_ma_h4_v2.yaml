# Trend-following study v2 (docs/research/trend_v2/PREREGISTRATION.md, recorded 2026-10-12 before any v2 run).
# Only change from v1: the Discovery period (6 years instead of 2). EA, grid, lot, profile and model are the same as v1
# (P10 archetype A1 structure; A1 was judged with a 2-year Discovery, so its rate is a guide only for 6 years).
# Periods avoid everything already seen with this EA (2014-01-02 .. 2016-01-01 and 2018-01-02 .. 2024-06-20) and the holdout.
study_id: trend_ma_h4_v2
strategy_file: ../strategies/rl_smoketest.yaml   # strategy_family defaults to RL_SmokeTest (earlier trials are counted)
symbol: EURUSD
timeframe: H4
from_date: 2008-01-02          # [from_date, to_date) in server time, about 6 years (v1 had 2 years: too little evidence per candidate)
to_date: 2014-01-01
param_space:
  InpFastPeriod: {start: 5, step: 5, stop: 25}      # A1: 5, 10, 15, 20, 25
  InpSlowPeriod: {start: 40, step: 20, stop: 120}   # A1: 40, 60, 80, 100, 120
fixed:
  InpLots: 0.10                                    # A1: lot 0.10
tester: {model: OHLC_M1, execution_delay_ms: 0, deposit: 10000, currency: USD, leverage: 100}
max_passes_per_job: 2000
coverage_tolerance_days: 7
